<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | NeverGpDzy</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10161d;
        --card: rgba(18, 24, 31, 0.88);
        --border: rgba(255, 255, 255, 0.16);
        --text: #f6f7fb;
        --muted: rgba(246, 247, 251, 0.72);
        --accent: #8fd6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(143, 214, 255, 0.14), transparent 40%),
          linear-gradient(180deg, #111822 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      main {
        width: min(100%, 560px);
        padding: 40px 32px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        text-align: center;
        backdrop-filter: blur(12px);
      }

      .code {
        margin: 0 0 12px;
        font-size: clamp(48px, 12vw, 84px);
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(24px, 6vw, 36px);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 20px;
        border-radius: 999px;
        border: 1px solid rgba(143, 214, 255, 0.35);
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        background: rgba(143, 214, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page may have moved, expired, or the link itself is invalid.</p>
      <a href="index.html">Back to home</a>
    </main>
  </body>
</html>
